name: Apply SNCK test isolation fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify payload
        run: |
          curl -fsSL -o /tmp/fix.tar.gz https://files.catbox.moe/eb6oq4.gz
          echo "f5f577330221e8d8cf5b43d09d3a0c0ddeee0e2fe321d5894e52cf526168f0d0  /tmp/fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fix.tar.gz
      - name: Commit fix
        run: |
          git config user.name "SnckBoy"
          git config user.email "snckboy@users.noreply.github.com"
          git add scripts/test-worlds-backups.mts
          git commit -m "Isolate world and backup tests from live panel data"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-testfix.yml
          git commit -m "Remove temporary testfix workflow"
          git push
