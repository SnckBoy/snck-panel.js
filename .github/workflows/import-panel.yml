name: Import SNCK Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download panel archive
        run: |
          curl -fsSL "https://files.catbox.moe/u9kfxj.gz" -o /tmp/panel.tar.gz
          tar -tzf /tmp/panel.tar.gz > /dev/null

      - name: Import and push
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/panel.tar.gz -C .
          git config user.name "SnckBoy"
          git config user.email "201361410+SnckBoy@users.noreply.github.com"
          git add -A
          git commit -m "Import SNCK Panel Node.js edition"
          git push origin HEAD:main
